<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="GrindBot">
  <!-- Engraved brass plaque holding the robot's head. Drawn by hand rather than
       traced from the render so the shapes still separate at 16px: the visor is
       one dark block, the eyes are two fat bars, the antenna is dropped. -->
  <rect width="64" height="64" rx="14" fill="#15130f"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="12" fill="none" stroke="#c89b4a" stroke-width="3.5"/>
  <!-- ears -->
  <rect x="9" y="27" width="6" height="14" rx="3" fill="#f2e7cf"/>
  <rect x="49" y="27" width="6" height="14" rx="3" fill="#f2e7cf"/>
  <!-- head -->
  <rect x="13" y="16" width="38" height="33" rx="10" fill="#f7eeda"/>
  <!-- visor -->
  <rect x="18" y="23" width="28" height="18" rx="7" fill="#15130f"/>
  <!-- eyes -->
  <rect x="24" y="27" width="5" height="10" rx="2.5" fill="#f0a91e"/>
  <rect x="35" y="27" width="5" height="10" rx="2.5" fill="#f0a91e"/>
</svg>
