name: mac

# Catches a broken macOS build before anyone tries to run build.sh.
on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "build.sh"
      - "config.default.json"
      - "messages.txt"
      - ".github/workflows/mac.yml"
  pull_request:
    paths:
      - "Sources/**"
      - "build.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build GrindBot.app
        run: ./build.sh

      - name: Verify the bundle
        run: |
          set -euo pipefail
          test -x GrindBot.app/Contents/MacOS/GrindBot
          test -f GrindBot.app/Contents/Resources/messages.txt
          test -f GrindBot.app/Contents/Resources/config.json
          # LSUIElement is what keeps it out of the Dock; a regression here is user-visible.
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" GrindBot.app/Contents/Info.plist | grep -qx true
          # The runner is arm64; without both slices Intel Macs can't launch it.
          lipo -info GrindBot.app/Contents/MacOS/GrindBot | tee /dev/stderr | grep -q "x86_64 arm64\|arm64 x86_64"
          # All five packs must be inside the bundle, so a lone .app still works.
          test "$(ls GrindBot.app/Contents/Resources/packs/*.txt | wc -l)" -eq "$(ls packs/*.txt | wc -l)"
          # The shipped config must be the defaults, not someone's working copy.
          diff -q config.default.json GrindBot.app/Contents/Resources/config.json
          codesign --verify --verbose GrindBot.app
          # The bundle had no icon at all until the .icns was generated in build.sh.
          test -s GrindBot.app/Contents/Resources/GrindBot.icns

      - name: Packs travel with the app
        run: |
          set -euo pipefail
          # Config.swift resolves a message file next to the bundle first, so an
          # artifact with only GrindBot.app in it has no packs at all: pick
          # packs/hustle.txt in Settings and every popup says "file is empty".
          shipped=$(ls packs/*.txt | wc -l | tr -d ' ')
          test "$shipped" -gt 0
          mkdir -p stage
          cp -R GrindBot.app packs stage/
          cp LICENSE CUSTOMIZING.md stage/
          staged=$(ls stage/packs/*.txt | wc -l | tr -d ' ')
          test "$staged" -eq "$shipped"
          for f in packs/*.txt messages.txt; do
            grep -qv '^[[:space:]]*$' "$f" || { echo "$f has no messages"; exit 1; }
          done

      - name: Package
        run: ditto -c -k --keepParent stage GrindBot-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GrindBot-mac
          path: GrindBot-mac.zip
          if-no-files-found: error
